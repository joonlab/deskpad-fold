<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="shot" content="w=1800,h=1103,scale=1">
<title>장면 1 · 맥 화면 — 메뉴바에서 폰 연결</title>
<link rel="stylesheet" href="https://mockup-kit.invalid/kit.css">
<script src="https://mockup-kit.invalid/kit.js"></script>
<style>
  body { background: #000; }
  .desk { zoom: 2.25; width: 800px; height: 490px; position: relative; overflow: hidden;
    background: radial-gradient(120% 90% at 20% 10%, #D5DEEA 0%, #9DB0C8 50%, #6F83A0 100%); }
  .mac-menubar { font-size: 14px; }
  .doc { position: absolute; left: 24px; top: 50px; width: 400px; height: 410px; }
  .doc .mac-body { padding: 20px 22px; font-size: 16px; line-height: 27px; }
  .doc h1 { margin: 0 0 4px; font-size: 22px; line-height: 30px; font-weight: 700; }
  .menu { position: absolute; top: 30px; right: 10px; width: 350px; z-index: 30; font-size: 15px; }
  .menu .m-item { height: 31px; }
  .menu .m-status { font-size: 15px; }
  .menu .m-item .kbd { font-size: 14px; }
  .menu .sub { margin-left: auto; color: var(--mac-dim); }
</style></head><body>
<div class="desk">
  <div class="mac-menubar">
    <span class="app-name">페이지</span><span>파일</span><span>편집</span><span>보기</span>
    <div class="extras">
      <span class="extra active"><i data-icon="smartphone"></i></span>
      <span class="extra"><i data-icon="wifi"></i></span>
      <span class="extra"><i data-icon="battery"></i></span>
      <span class="clock">9월 28일 (일) 오후 2:30</span>
    </div>
  </div>
  <div class="mac-window doc">
    <div class="mac-titlebar"><span class="traffic"><i></i><i></i><i></i></span><span class="mac-title">발표 대본</span></div>
    <div class="mac-body">
      <h1>금요일 발표 대본</h1>
      <div class="dim" style="font-size:14px">민지 · 초안 2</div>
      <div>안녕하세요. 동네 도서관<br>이용 조사 결과를 나눕니다.</div>
      <div>먼저 방문 시간대부터<br>보겠습니다.</div><div class="dim">회의 메모는 옆 화면에 띄워 두었습니다.</div>
    </div>
  </div>
  <div class="mac-menu menu">
    <div class="m-status"><span class="dot ok"></span><span>연결됨 · Android 브라우저</span></div>
    <div class="m-item off"><span class="check"></span>폰에 DeskPad 화면 공유 시작</div>
    <div class="m-item"><span class="check"></span>폰 다시 연결 — 새 링크<span class="kbd">⌘L</span></div>
    <div class="m-item"><span class="check"></span>링크만 복사</div>
    <div class="m-item"><span class="check"></span>연결 끊기</div>
    <div class="m-sep"></div>
    <div class="m-item"><span class="check"></span>가로</div>
    <div class="m-item hl"><span class="check">✓</span>세로</div>
    <div class="m-item"><span class="check"></span>해상도&nbsp; 924 × 1224 선명<span class="sub"><i data-icon="chevron-right"></i></span></div>
    <div class="m-sep"></div>
    <div class="m-item"><span class="check">✓</span>로그인 시 자동 실행</div>
    <div class="m-item"><span class="check"></span>종료<span class="kbd">⌘Q</span></div>
  </div>
</div>
</body></html>
