<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="shot" content="w=1084,h=1800,scale=1">
<title>장면 1 · 폰 화면 — 세로 보조모니터에 긴 문서</title>
<link rel="stylesheet" href="https://mockup-kit.invalid/kit.css">
<script src="https://mockup-kit.invalid/kit.js"></script>
<style>
  .screen { zoom: 3; width: 361.3px; height: 600px; }
  .vdesk { flex: 1; min-height: 0; position: relative; overflow: hidden;
    background: linear-gradient(160deg, #3B4A63 0%, #5A6E8C 55%, #8A9BB5 100%); }
  .vbar { height: 24px; padding: 0 10px; display: flex; align-items: center; gap: 12px; background: rgba(245,246,248,.9); color: #1D1D1F; font-size: 13px; white-space: nowrap; }
  .vbar .r { margin-left: auto; }
  .win { position: absolute; left: 8px; right: 8px; top: 32px; bottom: 10px; }
  .win .mac-title { font-size: 13px; }
  .win .mac-body { padding: 14px 16px; gap: 6px; font-size: 17px; line-height: 27px; }
  .win h1 { margin: 0; font-size: 22px; line-height: 30px; font-weight: 700; }
  .win .d { color: var(--mac-dim); font-size: 14px; margin-bottom: 4px; }
  .win ol { margin: 0; padding-left: 22px; }
  .win li { margin-bottom: 5px; }
  .win h2 { margin: 8px 0 0; font-size: 18px; font-weight: 700; }
</style></head><body>
<div class="screen">
  <div class="status-bar" data-time="2:30"></div>
  <div class="vdesk">
    <div class="vbar"><b>메모</b><span>파일</span><span>편집</span><span class="r">오후 2:30</span></div>
    <div class="mac-window win">
      <div class="mac-titlebar"><span class="traffic"><i></i><i></i><i></i></span><span class="mac-title">회의 메모</span></div>
      <div class="mac-body">
        <h1>회의 메모 — 금요일 발표</h1>
        <div class="d">민지, 서준 · 오전 10:00</div>
        <ol>
          <li>발표 순서: 민지 → 서준</li>
          <li>자료 마감은 목요일 저녁</li>
          <li>도서관 방문 시간대 표 추가</li>
          <li>질문 예상 3개 정리</li>
          <li>다음 회의 장소 예약</li>
        </ol>
        <h2>할 일</h2>
        <ol>
          <li>서준: 표 다시 그리기</li>
          <li>민지: 대본 초안 3</li>
          <li>같이: 리허설 1회</li>
        </ol>
      </div>
    </div>
  </div>
  <div class="nav-handle"></div>
</div>
</body></html>
